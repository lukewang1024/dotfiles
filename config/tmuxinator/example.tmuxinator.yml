# Reference tmuxinator layout — the canonical task session (task/window model).
# This file is a TEMPLATE (not auto-loaded). Two ways to use it:
#
#   1. Repo-local, params live in the repo:
#        cp this to <repo>/.tmuxinator.yml  (commit it, or gitignore for local-only)
#        cd <repo> && tmuxinator local        # alias: mux start .
#
#   2. Named, machine-local, pickable from sesh (prefix+T):
#        cp this to ~/.config/tmuxinator/<name>.yml  (set name + absolute root)
#        sesh shows it automatically; selecting it runs `tmuxinator start <name>`.
#      (gen-tmuxinator-configs writes exactly this shape, one per pooled repo.)
#
# Model: a session is a TASK, seeded with one repo. Two kinds of window:
#   +----------------------+     +----------------------+
#   |                      |     |  git (tig/lazygit)   |   <- <repo> window:
#   |   agent  (tmux-agent-workbench agent start --managed) |     +----------------------+      that repo's
#   |   = the driver,      |     |  shell (scratchpad)  |      inspection surface,
#   |     full window      |     +----------------------+      even-vertical
#   |                      |     |  editor (nvim/vim)   |
#   |                      |     +----------------------+
#   |                      |     |  [dev]               |   <- frontends only
#   +----------------------+     +----------------------+
#     ^ startup lands here          ^ one per repo in the task
#
# A Workspace task GROWS by accretion — fold in more repos as inspection windows:
#   - manually:  prefix+G  (pick a repo from the pool)
#   - the agent: in a Workspace session, it runs `tmux-agent-workbench add <repo>`
#     when its work reaches into a repo that is not yet a workspace member. Put
#     this in the repo's CLAUDE.md / AGENTS.md (codex + opencode read AGENTS.md
#     too) so all three agents follow it. In an ordinary session, it does not
#     run any inspect/add command:
#
#       When your work starts touching another local repo in a Workspace task,
#       run `tmux-agent-workbench add <repo-short-name>` once so its worktree and
#       inspection window are created. Do not run this in an ordinary session.
#       Then bring it into your own write scope: Claude → `/add-dir <path>`;
#       codex → relaunch with `--add-dir <path>` if you must write there (reads
#       already work); opencode → it will prompt on first external access.
#
# tmux-agent-workbench agent start --managed starts the CLI selected by @workbench-agent / $WORKBENCH_AGENT.
# This dotfiles setup defaults it to codex in tmux.conf.

name: REPLACE-ME              # session name (and sesh picker label) = the task
root: .                       # repo-local: "." ; named config: absolute repo path
startup_window: agent

windows:
  - agent:                    # the session-level coding agent — where you steer
      - tmux-agent-workbench agent start --managed
  - REPLACE-ME:               # seed repo's inspection window (name it after the repo)
      layout: even-vertical
      panes:
        - git:                # tig by default; MUX_GIT_TOOL=lazygit to swap it
            - tig
        - shell:              # empty scratchpad — lands here, not in git/editor
        - editor:             # $VISUAL/$EDITOR, else nvim falling back to vim
            - vim
        - dev:                # dev server — delete this whole pane for backends
            -                 # e.g. add "pnpm --filter portal dev" to auto-run

# Auto-loaded when the OS reports no color-scheme preference — see
# dark-theme.auto.conf. Default to dark, matching kitty's prior pinned default.
# Note: GNOME reports no-preference when "Dark style" is off, i.e. for light
# mode; if you use GNOME and want light there, include ./theme-light.conf here.
include ./kitty-themes/themes/OneDark.conf

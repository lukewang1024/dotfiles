# Auto-loaded by kitty when the OS is in dark mode (native OS-appearance
# following, kitty >= 0.35). kitty queries the OS color scheme and live-switches
# between this / light-theme.auto.conf / no-preference-theme.auto.conf on change.
# Colors here override everything else, so keep the palette only in the include.
include ./kitty-themes/themes/OneDark.conf

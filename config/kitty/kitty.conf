# vim:fileencoding=utf-8:foldmethod=marker

# Colors follow the OS light/dark setting natively (kitty >= 0.35): kitty
# auto-loads {dark,light,no-preference}-theme.auto.conf from this dir and
# live-switches on OS change. Those override any colors set here, so no static
# theme include belongs in this file.

font_family MesloLGS Nerd Font
font_size 14
confirm_os_window_close 0
macos_option_as_alt left

# show status bar at bottom for remote session,
# so it do not stack together with local session's one
set -g status-position bottom

# use hostname (@#h) in set-titles-string with SSH
set -g set-titles-string "[tmux] [#S:#I.#P @#h] #W"

# Remote mode keeps fewer visible widgets, but must retain Continuum's invisible
# status command: it is the timer that drives automatic Resurrect saves.
set -g @adaptive_widgets "$continuum_save#{?#{e|>=:#{client_width},100},$cpu_status,}$off_mode"
set -g @adaptive_widgets_min_width 100

# Each window sizes to the smallest client that currently has it focused, so a
# phone and a desktop attached to the same (or a grouped) session don't force
# every window down to the phone's size — only the window the phone is looking at.
setw -g aggressive-resize on


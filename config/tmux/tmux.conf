# syntax:ssHash

set -g prefix2 `      # backtick is pretty handy in many cases
bind ` send-prefix -2 # `` sends a ` in case you need one

set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.local/share/tmux/plugins'

# >> settings

set -g mode-keys vi
set -g update-environment "DISPLAY SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION TERM TERM_PROGRAM WINDOWID XAUTHORITY"
set -g mouse on
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1
set -g display-panes-time 4000
setw -g monitor-activity on
# No pop-up notification banner for activity/bell — the adaptive theme shows a
# recolored separator mark in the window tab instead (keep monitor-* on so the
# window_activity_flag / window_bell_flag the mark keys on still get set).
set -g visual-activity off
set -g visual-bell off
set -g status-position top
set -sg escape-time 0
set -sa terminal-overrides ',xterm-256color:RGB'
set -g set-clipboard on
set -g set-titles on
set -g set-titles-string "[tmux] [#S:#I.#P] #W"
set -g main-pane-width 100

# for vim-oscyank to work properly in tmux 3.3
# https://github.com/ojroques/vim-oscyank/issues/26#issuecomment-1179722561
set -g allow-passthrough on

set -g default-terminal screen-256color # macOS has ncurses 5.4 which does not have tmux-256color

# >> window management

# comma, period to move between windows
bind -r , previous-window   # move window one position to the left
bind -r . next-window       # move window one position to the right

# shift + arrow to switch windows (no prefix needed)
bind -n S-Left  previous-window
bind -n S-Right next-window

# make up for the default rename-window shortcut 'prefix-comma'
bind ^ command-prompt -I "#W" "rename-window -- '%%'"

# >> layout presets that leave the sidebar out of the layout computation
#
# tmux has no sidebar primitive: every pane is a leaf of the window's split tree
# and select-layout re-tiles all of them, so prefix + M-1..M-7 (and prefix+Space)
# swallow the fixed-width agent sidebar exactly like any other pane. There is no
# "exclude from layout" pane option to set, so tmux-layout-keep-sidebar fakes the
# missing primitive: break-pane the sidebar into a throwaway window, apply the
# preset to the workspace panes alone, join-pane it back with -f (full-height,
# top-level) at @sidebar_width. See the script header for the details; with no
# sidebar in the window it just forwards to select-layout, so these keys behave
# exactly like the defaults they replace. #{pane_id} is expanded by run-shell —
# it can't be dropped, tmux does not export TMUX_PANE to run-shell children.
#
# The same for 'prefix + e' (make up for the default 'select-layout -E' shortcut
# 'prefix-E'): -E is subtree-scoped and so mostly harmless, except when the
# workspace holds a single pane — then the sidebar is its only sibling and the
# spread splits the window in half.
bind e     run -b '~/.local/bin/tmux-layout-keep-sidebar -E #{pane_id}'
bind Space run -b '~/.local/bin/tmux-layout-keep-sidebar -n #{pane_id}'
bind M-1   run -b '~/.local/bin/tmux-layout-keep-sidebar even-horizontal #{pane_id}'
bind M-2   run -b '~/.local/bin/tmux-layout-keep-sidebar even-vertical #{pane_id}'
bind M-3   run -b '~/.local/bin/tmux-layout-keep-sidebar main-horizontal #{pane_id}'
bind M-4   run -b '~/.local/bin/tmux-layout-keep-sidebar main-vertical #{pane_id}'
bind M-5   run -b '~/.local/bin/tmux-layout-keep-sidebar tiled #{pane_id}'
bind M-6   run -b '~/.local/bin/tmux-layout-keep-sidebar main-horizontal-mirrored #{pane_id}'
bind M-7   run -b '~/.local/bin/tmux-layout-keep-sidebar main-vertical-mirrored #{pane_id}'

# middle click on a window name in status bar to kill it
bind -n MouseDown2Status kill-window

# middle click in a pane to paste
bind -n MouseDown2Pane run -b "exec </dev/null; xclip -o | awk 1 ORS=' ' | tmux load-buffer - ; tmux paste-buffer"

# swap & move windows & panes
bind s choose-tree -Zs -O name
bind W choose-tree -Zw -O name "swap-window -t '%%'"
bind Q choose-tree -Zw -O name "swap-pane -t '%%'"
bind E choose-tree -Zw -O name "move-pane -t '%%'"
bind M-w command-prompt -p "Swap Current Window To? (e.g 3; 4; session_name:5)" "swap-window -t '%%'"
bind M-q command-prompt -p "Swap Current Pane To? (e.g 2.0; session_name:4.0)" "swap-pane -t '%%'"
bind M-e command-prompt -p "Move Current Pane To? (e.g 3.1; session_name:6.0)" "move-pane -t '%%'"

# >> sesh smart session manager (https://github.com/joshmedeski/sesh)

# prefix + T -> fuzzy picker over tmux sessions, zoxide dirs & configured sesh
# sessions. The picker lives in `util/shell/sesh-connect` to keep the quoting
# out of here; bound only when the sesh binary is present so machines without
# it are unaffected.
if-shell 'command -v sesh >/dev/null 2>&1' \
  'bind -N "sesh session picker" T run-shell -b sesh-connect'

# prefix + G/M-g/M-t/M-T -> tmux-agent-workbench (agentic coding task/window
# model + git-worktree workspaces), installed via TPM as its own repo
# (lukewang1024/tmux-agent-workbench, listed in @tpm_plugins below). TPM auto-
# sources the root workbench.tmux; the layer-2 git entrypoint lives in a subdir
# TPM's top-level *.tmux scan doesn't reach, so it's sourced explicitly after
# tpm init (search "workbench-git" below). Each of the two entrypoints registers
# its own keys (G = inspect picker, M-g = regenerate the pool, M-t = new
# workspace, M-T = promote current repo) — see that repo's README for what each
# does and how to reconfigure. M-t/M-T are grouped under t because plain T above
# (sesh) is already "pick an existing session" — M-t/M-T extend that into "start
# a new one" / "derive one from here". (Not R — tmux-sensible owns prefix+R.
# Not plain g — tmux-sessionist's goto-session binds it at TPM load. Not @/C-@ —
# tmux-sessionist owns those for its own pane/window promotion.)

# >> copy & paste

# use Vi-style keys for copying and pasting
bind v copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection
bind p paste-buffer

# PageUp, PageDown support
bind -n PPage if-shell -F "#{alternate_on}" "send-keys PPage" "copy-mode -e; send-keys PPage"
bind -T copy-mode-vi PPage send-keys -X page-up
bind -T copy-mode-vi NPage send-keys -X page-down

# mouse wheel support
bind -n WheelUpPane if-shell -F -t = "#{alternate_on}" "send-keys -M" "select-pane -t =; copy-mode -e; send-keys -M"
bind -n WheelDownPane if-shell -F -t = "#{alternate_on}" "send-keys -M" "select-pane -t =; send-keys -M"
bind -T copy-mode-vi WheelUpPane send-keys -X halfpage-up
bind -T copy-mode-vi WheelDownPane send-keys -X halfpage-down

# >> nested remote tmux sessions

bind -T root F12  \
  set prefix None \;\
  set prefix2 None \;\
  set key-table off \;\
  if -F '#{pane_in_mode}' 'send-keys -X cancel' \;\
  refresh-client -S \;\

bind -T off F12 \
  set -u prefix \;\
  set -u prefix2 \;\
  set -u key-table \;\
  refresh-client -S

# >> synchronize commands to panes/windows/sessions

# send the same command to all panes in the same window
bind a command-prompt -p 'Command to all panes in this window:' \
  "run \"tmux list-panes -F '##{pane_index}' | xargs -I PANE \
    tmux send-keys -t PANE '%1' Enter\""

# alternative to using the above "a" binding is to enable pane synchronization,
# type the command you want to execute in all panes in the same window and disable
# pane synchronization. So it would be: A <type the command RET> A
bind A if -F '#{pane_synchronized}' \
  'setw synchronize-panes off; display "Pane synchronization turned off."' \
  'setw synchronize-panes on; display "Pane synchronization turned on."'

# send the same command to all panes/windows in the specified session
# inspired from http://stackoverflow.com/questions/9250884/send-command-to-all-window-in-tmux
bind C-a command-prompt -p 'Session:,Command:' \
  "run \"tmux list-windows -t %1 -F '%1:##{window_index}' | xargs -I SESS_WIN \
    tmux list-panes -t SESS_WIN -F 'SESS_WIN.##{pane_index}' | xargs -I SESS_WIN_PANE \
    tmux send-keys -t SESS_WIN_PANE '%2' Enter\""

# send the same command to all panes/windows/sessions
bind C-A command-prompt -p "Command to all panes/windows/sessions:" \
  "run \"tmux list-sessions -F '##{session_name}' | xargs -I SESS \
    tmux list-windows -t SESS -F 'SESS:##{window_index}' | xargs -I SESS_WIN \
    tmux list-panes -t SESS_WIN -F 'SESS_WIN.##{pane_index}' | xargs -I SESS_WIN_PANE \
    tmux send-keys -t SESS_WIN_PANE '%1' Enter\""

# >> vim integration

# smart pane switching with awareness of vim splits
# see: https://github.com/christoomey/vim-tmux-navigator
is_vim='echo "#{pane_current_command}" | grep -iqE "(^|\/)g?(view|n?vim?x?)(diff)?$"'

# use Alt-vim keys without prefix key to switch panes
bind -n M-h if "$is_vim" "send-keys C-h" "select-pane -L"
bind -n M-j if "$is_vim" "send-keys C-j" "select-pane -D"
bind -n M-k if "$is_vim" "send-keys C-k" "select-pane -U"
bind -n M-l if "$is_vim" "send-keys C-l" "select-pane -R"
bind -n C-\\ if "$is_vim" "send-keys C-\\" "select-pane -l"

# use Alt-arrow keys without prefix key to switch panes
bind -n M-Left if "$is_vim" "send-keys C-h" "select-pane -L"
bind -n M-Right if "$is_vim" "send-keys C-l" "select-pane -R"
bind -n M-Up if "$is_vim" "send-keys C-k" "select-pane -U"
bind -n M-Down if "$is_vim" "send-keys C-j" "select-pane -D"

# >> misc shortcuts

# toggle the status line shown between top & bottom
bind B set status-position

# command prompt
# move focus to command prompt. tmux commands can be entered there directly
# without using the `tmux` prefix and it also supports auto-complete.
bind -n M-x command-prompt # default command-prompt binding "PREFIX :" also works

# loads a man page in a new pane
bind M-- command-prompt -p "Show man page of:" "split-window -v 'exec man %%'"
bind M-\\ command-prompt -p "Show man page of:" "split-window -h 'exec man %%'"

# runs ssh in a new window, you might want connect instead
bind C-\\ command-prompt -p "ssh to:" "new-window -n %1 'ssh %1'"

# >> list of plugins
# Independent plugins are listed alphabetically. The save/restore trio at the
# end is order-sensitive and must stay last, in this order: tmux-resurrect
# loads first, tmux-continuum (conventionally last) drives auto-save/restore,
# and tmux-assistant-resurrect hooks into both — so it must follow them.
set -g @tpm_plugins '                 \
  abhinav/tmux-fastcopy               \
  b0o/tmux-autoreload                 \
  lukewang1024/tmux-agent-sidebar#downstream \
  laktak/extrakto                     \
  lukewang1024/tmux-adaptive-theme    \
  lukewang1024/tmux-agent-workbench   \
  tmux-plugins/tmux-battery           \
  tmux-plugins/tmux-copycat           \
  tmux-plugins/tmux-cpu               \
  tmux-plugins/tmux-fpp               \
  tmux-plugins/tmux-logging           \
  tmux-plugins/tmux-open              \
  tmux-plugins/tmux-pain-control      \
  tmux-plugins/tmux-prefix-highlight  \
  tmux-plugins/tmux-sensible          \
  tmux-plugins/tmux-sessionist        \
  tmux-plugins/tmux-urlview           \
  tmux-plugins/tmux-yank              \
  tmux-plugins/tpm                    \
  tmux-plugins/tmux-resurrect         \
  tmux-plugins/tmux-continuum         \
  timvw/tmux-assistant-resurrect      \
'

# plugin configs

# tmux-agent-sidebar: reuse the keys freed up from the old tmux-sidebar plugin
set -g @sidebar_key 'Tab'      # prefix + Tab        -> toggle in current window
set -g @sidebar_key_all 'BTab' # prefix + Shift+Tab  -> toggle across all windows
# Auto-create the sidebar in new windows, but defer it so declaratively-built
# windows finish first. tmuxinator builds a window as split-window×N +
# select-layout; the create-only hook fires while the window still has one pane,
# so a synchronous sidebar split lands mid-build and select-layout then runs with
# an extra pane, scrambling sizes/roles. The delay backgrounds the split past
# tmuxinator's (near-instant) structural build — the slow part (claude/tig/nvim
# booting inside panes) never moves pane borders, so 0.5s is plenty. End state
# matches a manual prefix+Tab: a full-height left split that just shrinks the
# finished layout. Still summonable any time with prefix+Tab.
set -g @sidebar_auto_create on
set -g @sidebar_auto_create_delay 0.5
# Suppress the sidebar's own desktop notification (raw osascript -> shows as
# "Script Editor" in Notification Center). The peon-ping colorful overlay
# already covers agent-completion notifications, so this dupe is redundant.
set -g @sidebar_notifications off
# Theme-adaptive colors: draw the sidebar from the terminal's own 16-color ANSI
# palette (+ default fg) instead of fixed xterm-256 indexes, so it follows the
# light/dark theme that tmux-adaptive-theme / dark-notify flips. Without it the
# fixed near-white body text is invisible on a light background, and a fixed
# dark selection band hides the selected row. Selection becomes a reverse-video
# bar (legible on both). Fork feature (@sidebar_ansi_theme, PR #138).
set -g @sidebar_ansi_theme on

# >> extrakto — fzf fuzzy-grab of paths/URLs/words/hashes off the visible pane,
# then insert / copy / open the selection. Supersedes fpp+urlview ergonomically
# but kept alongside them for now. Its default key is prefix+Tab, which
# tmux-agent-sidebar already owns above. prefix+X is out too — tmux-sessionist
# binds it to kill-session and loads after extrakto — so use prefix+V, pairing
# with prefix+v (copy-mode) and free of any default/plugin. Needs fzf (have it)
# plus a clipboard tool (pbcopy on macOS).
set -g @extrakto_key 'V'

# >> tmux-fastcopy — EasyMotion-style labelled jump: overlays hint keys on every
# path/URL/hash in the pane, press the hint to copy it. Default key is prefix+f,
# already taken by tmux-fpp, so use prefix+F (unbound by default). Requires the
# `tmux-fastcopy` binary on PATH (brew abhinav/tap/tmux-fastcopy — registered in
# bootstrap/nix.sh; also `go install go.abhg.dev/tmux-fastcopy@latest`).
set -g @fastcopy-key 'F'

# >> tmux-autoreload — watches this sourced config and reloads it on save; no
# keybinding. Needs `entr` on PATH (registered in bootstrap/nix.sh); without it
# the plugin prints a one-time hint and stays idle.

# >> responsive small-screen behavior (gated by screen size, local or remote)
#
# Below a width threshold a multi-pane tile is unreadable — a phone or a cramped
# low-res terminal over SSH, but equally a small local window. The auto-create
# plugin's built-in sidebar + 80-column main-area fit rule already keeps a new
# window single-pane when it's too narrow for a sidebar; these hooks handle the other
# half: collapse the focused pane to a zoomed full-screen view — zoom-in only, so
# we never yank a pane back from under you (prefix+z to leave). The 100-col floor
# here is about collapsing any cramped multi-pane tmuxinator tile, independent of
# the sidebar.
#
# Reset before declaring: `set-hook -ga` APPENDS, and this file is re-sourced on
# every save (tmux-autoreload, below) — so each reload used to stack another copy
# of every hook it registers. A long-lived server had 28 client-attached entries,
# i.e. every attach re-ran the same handlers 14 times over. Unsetting the three
# arrays this file owns makes a reload idempotent; plugin-registered handlers land
# in the same arrays but tpm re-sources every plugin later in this same load, so
# they come straight back. Keep this above the first set-hook and above `run tpm`.
set-hook -gu client-attached
set-hook -gu client-resized
set-hook -gu window-resized
set-hook -ga client-attached 'if -F "#{&&:#{<:#{client_width},100},#{==:#{window_zoomed_flag},0}}" "resize-pane -Z"'
set-hook -ga client-resized  'if -F "#{&&:#{<:#{client_width},100},#{==:#{window_zoomed_flag},0}}" "resize-pane -Z"'
# A client resize may also resize background windows. The sidebar plugin's
# client-resized hook only repairs the client's current #{window_id}, leaving
# those background sidebars squeezed as narrow as one column. window-resized
# runs once for every affected window with the correct window context.
set-hook -ga window-resized 'run-shell -b "\"#{@agent_sidebar_bin}\" maintain-width \"#{window_id}\""'

# main-vertical layouts (tmuxinator coding layout): agent pane gets the bigger
# left column, the git/shell/dev/editor stack shares the rest.
set -g main-pane-width 55%

set -g @continuum-restore 'on'
# Auto-save every 15 min (default 5). Each save floods the single-threaded tmux
# server with the resurrect+assistant capture work; widening the interval cuts
# how often a window switch can collide with that background storm.
set -g @continuum-save-interval 15
set -g @resurrect-processes 'lazygit tig ~tmux-sidebar-resurrect-pane'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-strategy-vim 'session'

# >> adaptive-theme widgets — fed to the plugin via @adaptive_widgets. tmux.conf
# expands the $-vars at parse time; the plugin is installed by tpm
# (lukewang1024/tmux-adaptive-theme, listed in @tpm_plugins above).
separator=''
off_mode="#[fg=$color_light,bg=$color_window_off_indicator]#([ $(tmux show-option -qv key-table) = 'off' ] && echo '#{separator} OFF')"
battery_status='#{battery_icon} #{battery_percentage}'
cpu_status='CPU #{cpu_percentage}'
# Continuum schedules saves through an invisible status-right command. Keep the
# command in the adaptive theme's own template: every appearance change rewrites
# status-right, so relying on Continuum's one-time injection stops auto-saving
# as soon as the theme is reapplied.
continuum_save="#($HOME/.local/share/tmux/plugins/tmux-continuum/scripts/continuum_save.sh)"
adaptive_widgets="$continuum_save$battery_status #{separator} $cpu_status $off_mode"

set -g @adaptive_widgets "$adaptive_widgets"
set -g @adaptive_date_format '%a %d %b'
set -g @adaptive_mode full

# >> OS-appearance fallback — the login-scoped appearance-daemon fans macOS
# light/dark changes out to every local tmux server. The indexed session-created
# hook below covers a server started after the last change. The fallback defers
# to native mode-2031 reporting when present.

# remote session specific configs
if 'test -n "$SSH_CLIENT"' 'source ~/.config/tmux/remote.tmux.conf'

# tmux-agent-workbench defaults. mux-agent still marks task workbenches with
# @workbench_task; this only changes which CLI it execs by default.
set -g @workbench-agent 'codex'

# local configs
if 'test -f ~/.config/.tmux.conf.local' 'source ~/.config/.tmux.conf.local'

# automatic tpm installation
if 'test ! -d ~/.local/share/tmux/plugins/tpm' \
  'run "git clone https://github.com/tmux-plugins/tpm ~/.local/share/tmux/plugins/tpm"'

# initialize tmux plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.local/share/tmux/plugins/tpm/tpm'

# tmux-agent-workbench layer 2 (git-worktree workspaces). TPM's tpm run above
# already sourced the plugin's root workbench.tmux (layer 1), but its top-level
# *.tmux scan doesn't reach subdirs, so its git/ entrypoint needs sourcing by
# hand — after tpm has cloned the plugin, and after layer 1 it depends on. It
# self-gates on @workbench-disable-git, so this is safe to always run.
if 'test -f ~/.local/share/tmux/plugins/tmux-agent-workbench/git/workbench-git.tmux' \
  'run-shell -b "~/.local/share/tmux/plugins/tmux-agent-workbench/git/workbench-git.tmux"'

# tmux-autoreload (b0o/tmux-autoreload, in @tpm_plugins) — watch this config and
# reload on save. tpm auto-launches it, but on stock macOS that launch dies on
# GNU `realpath -e` / bash 3.2; the launcher wrapper prepends coreutils gnubin
# for its own process and relies on the brew bash (both registered in
# bootstrap/nix.sh), then execs the plugin. Singleton, so if tpm already started
# it (Linux, where those deps are native) this just no-ops. See the wrapper at
# util/shell/tmux-autoreload-launch for the full rationale.
run-shell -b tmux-autoreload-launch

# status theme — tmux-adaptive-theme
# (github.com/lukewang1024/tmux-adaptive-theme), installed by tpm via @plugin
# above and sourced during tpm's run. The theme re-expands the
# battery/cpu/prefix-highlight widgets itself, so it is order-independent w.r.t.
# those plugins. Re-apply on attach so a fresh client picks up the current
# light/dark palette. (The append stays idempotent across reloads thanks to the
# `set-hook -gu client-attached` reset near the responsive-behavior hooks above.)
set-hook -ga client-attached 'run-shell -b "~/.local/share/tmux/plugins/tmux-adaptive-theme/tmux-adaptive-theme.tmux"'
# On the very first `tmux new-session`, the server reads tmux.conf before it has
# created either the session or its client. TPM therefore sources the theme too
# early (its `has-session` guard correctly no-ops). appearance-daemon can also
# publish while no tmux session exists, so tmux-appearance-fallback has nothing
# to update and the theme's dark default remains. session-created is the first reliable
# post-config event, so resolve the current OS/state appearance there and paint
# in one step. Native client theme reports still win via the fallback's guard.
# The named slot is replaced, rather than appended, on config reloads.
set-hook -g 'session-created[90]' 'run-shell -b "tmux-appearance-fallback auto"'

# tmux-resurrect normally treats the agent sidebar as an ordinary pane, so its
# saved pane list includes the sidebar process but not its @pane_role marker.
# Route manual and continuum saves through wrappers that rewrite that pane's
# restore command. Resurrect can then restore the original pane and layout in
# place; the command restores its role before execing the sidebar binary.
# Resolve the installed paths at runtime so the config remains home-portable.
run-shell '
  save=$(command -v tmux-sidebar-resurrect-save 2>/dev/null) || exit 0
  restore=$(command -v tmux-sidebar-resurrect-restore 2>/dev/null) || exit 0
  tmux set-option -g @resurrect-save-script-path "$save"
  tmux set-option -g @resurrect-restore-script-path "$restore"
  tmux bind-key C-s run-shell "$save"
  tmux bind-key C-r run-shell "$restore"
'

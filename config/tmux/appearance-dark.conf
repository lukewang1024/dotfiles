# Sourced by tmux-dark-notify (@dark-notify-theme-path-dark) when macOS switches
# to DARK. It doesn't set a theme itself — it hands off to the guarded fallback,
# which drives tmux-adaptive-theme only for terminals without native mode-2031
# reporting. See util/shell/tmux-appearance-fallback for the why.
run-shell -b 'tmux-appearance-fallback dark'
# Alacritty has no native OS-theme following — swap its imported theme to match.
run-shell -b 'alacritty-appearance dark'

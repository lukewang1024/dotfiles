# Sourced by tmux-dark-notify (@dark-notify-theme-path-light) when macOS switches
# to LIGHT. It doesn't set a theme itself — it hands off to the guarded fallback,
# which drives tmux-adaptive-theme only for terminals without native mode-2031
# reporting. See util/shell/tmux-appearance-fallback for the why.
run-shell -b 'tmux-appearance-fallback light'
# Alacritty has no native OS-theme following — swap its imported theme to match.
run-shell -b 'alacritty-appearance light'

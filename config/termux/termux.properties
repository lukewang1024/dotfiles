# Two rows: device/session controls, symbols, inverted-T arrows, editing and paging.
# Every key has a swipe-up action. SSH Menu uses the Workbench prefix + Alt+t.
# Ctrl+U uses the shell binding (Zsh default: kill the entire line).
extra-keys = [ \
  [ \
    {key: 'KEYBOARD', display: '⌨', popup: {key: 'DRAWER', display: '☰'}}, \
    {key: 'ESC', display: '⎋', popup: {macro: 'CTRL c', display: '^c'}}, \
    {key: 'TAB', display: '↹', popup: {macro: 'SHIFT TAB', display: '⇤'}}, \
    {key: '`', popup: '~'}, \
    {key: '$', popup: '%'}, \
    {key: '\\\\', display: '＼', popup: '|'}, \
    {key: '[', popup: '{'}, \
    {key: 'UP', popup: {macro: 'CTRL r', display: '^r'}}, \
    {key: ']', popup: '}'}, \
    {key: 'BKSP', display: '⌫', popup: {key: 'DEL', display: '⌦'}}, \
    {key: 'PGUP', display: '⇞', popup: {macro: 'SHIFT PGUP', display: '⇧⇞'}} \
  ], \
  [ \
    {macro: 'ssh-connect SPACE --workbench ENTER', display: '🖥', popup: {macro: '` ALT t', display: '▦'}}, \
    {key: 'CTRL', display: '⌃', popup: {macro: 'CTRL w', display: '^w'}}, \
    {key: 'ALT', display: '⌥', popup: {macro: 'CTRL k', display: '^k'}}, \
    {key: 'SHIFT', display: '⇧', popup: {macro: 'CTRL u', display: '^u'}}, \
    {key: '-', display: '-', popup: '_'}, \
    {key: '/', popup: '?'}, \
    {key: 'LEFT', popup: {key: 'HOME', display: '↤'}}, \
    {key: 'DOWN', popup: {macro: 'CTRL l', display: '^l'}}, \
    {key: 'RIGHT', popup: {key: 'END', display: '↦'}}, \
    {key: 'ENTER', display: '⏎', popup: {macro: 'CTRL d', display: '^d'}}, \
    {key: 'PGDN', display: '⇟', popup: {macro: 'SHIFT PGDN', display: '⇧⇟'}} \
  ] \
]
extra-keys-style = arrows-all
extra-keys-text-all-caps = false
terminal-onclick-url-open = true
# Required for Termux:API notification actions to run the Workbench click
# handler. Android still gates callers with com.termux.permission.RUN_COMMAND.
allow-external-apps = true

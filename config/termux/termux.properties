# Termux does not support orientation-specific layouts, so stay at two rows in
# both portrait and landscape. Keep Termux's stock seven columns intact in the
# middle. Device/session controls (Keyboard/SSH) stay on the left; the more
# frequently tapped tmux/Agent controls sit under the right thumb. Taps perform
# the primary action; swipe-up carries its nearest secondary action.
extra-keys = [ \
  [ \
    {key: 'KEYBOARD', display: '⌨', popup: {macro: 'CTRL u', display: '^U'}}, \
    {key: 'ESC', display: 'esc', popup: {macro: 'CTRL d', display: '^D'}}, \
    {key: '/', popup: '|'}, \
    {key: '-', popup: '_'}, \
    {key: 'HOME', display: '↤', popup: {macro: '` ,', display: 'W←'}}, \
    {key: 'UP', popup: {macro: '` UP', display: 'P↑'}}, \
    {key: 'END', display: '↦', popup: {macro: '` .', display: 'W→'}}, \
    {key: 'PGUP', display: '⇞', popup: {macro: '` v', display: 'C▤'}}, \
    {key: '`', display: 'tmux', popup: {macro: '` ALT t', display: 'T☰'}} \
  ], \
  [ \
    {macro: 'ssh-connect ENTER', display: 'ssh', popup: {macro: 'termux-kinit-shortcut ENTER', display: 'K↻'}}, \
    {key: 'TAB', display: '⇥', popup: {macro: '` z', display: 'P⛶'}}, \
    {key: 'CTRL', display: 'ctrl', popup: {macro: 'CTRL c', display: '^C'}}, \
    {key: 'ALT', display: 'alt', popup: {macro: 'CTRL l', display: '^L'}}, \
    {key: 'LEFT', popup: {macro: '` LEFT', display: 'P←'}}, \
    {key: 'DOWN', popup: {macro: '` DOWN', display: 'P↓'}}, \
    {key: 'RIGHT', popup: {macro: '` RIGHT', display: 'P→'}}, \
    {key: 'PGDN', display: '⇟', popup: {macro: '` p', display: 'B↓'}}, \
    {macro: '` TAB', display: '◧', popup: {macro: '` ALT a', display: 'C☰'}} \
  ] \
]
extra-keys-style = arrows-all
extra-keys-text-all-caps = false
terminal-onclick-url-open = true

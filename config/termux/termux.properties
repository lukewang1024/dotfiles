# Termux does not support orientation-specific layouts, so stay at two rows in
# both portrait and landscape. Taps retain the default keys; swipe-up popups
# carry the remote tmux controls. The two higher-impact Keyboard/SSH buttons
# stay at the far left, away from the navigation keys most often tapped.
extra-keys = [[{key: 'KEYBOARD', display: '⌨', popup: {key: 'DRAWER', display: '☰'}},{key: 'ESC', display: 'esc', popup: {macro: 'CTRL d', display: '^D'}},{key: '`', display: 'pfx', popup: {macro: '` TAB', display: 'A☰'}},{key: '/', popup: '|'},{key: 'HOME', display: '↤', popup: {macro: '` ,', display: 'W←'}},{key: 'UP', popup: {macro: '` UP', display: 'P↑'}},{key: 'END', display: '↦', popup: {macro: '` .', display: 'W→'}},{key: 'PGUP', display: '⇞', popup: {macro: '` v', display: 'C▤'}}], [{macro: 'ssh SPACE termux-ssh-shortcut ENTER', display: 'ssh', popup: {macro: 'termux-kinit-shortcut ENTER', display: 'K↻'}},{key: 'CTRL', display: 'ctrl', popup: {macro: 'CTRL c', display: '^C'}},{key: 'ALT', display: 'alt', popup: {macro: '` z', display: 'P⛶'}},{key: 'TAB', display: '⇥', popup: {macro: '` c', display: 'W＋'}},{key: 'LEFT', popup: {macro: '` LEFT', display: 'P←'}},{key: 'DOWN', popup: {macro: '` DOWN', display: 'P↓'}},{key: 'RIGHT', popup: {macro: '` RIGHT', display: 'P→'}},{key: 'PGDN', display: '⇟', popup: {macro: '` p', display: 'B↓'}}]]
extra-keys-style = arrows-all
terminal-onclick-url-open = true

# Termux does not support orientation-specific layouts, so stay at two rows in
# both portrait and landscape. Taps retain the default keys; swipe-up popups
# carry the remote tmux controls. The two higher-impact Keyboard/SSH buttons
# stay at the far left, away from the navigation keys most often tapped.
extra-keys = [[{key: 'KEYBOARD', display: '⌨', popup: {key: 'DRAWER', display: '☰'}},{macro: 'ssh SPACE termux-ssh-shortcut ENTER', display: '▣', popup: {macro: 'termux-kinit-shortcut ENTER', display: 'K↻'}},{key: 'ESC', display: '⎋', popup: {macro: 'CTRL d', display: '^D'}},{key: '`', display: 'Pfx', popup: {macro: '` TAB', display: 'Agent'}},{key: 'HOME', display: '↤', popup: {macro: '` ,', display: 'W←'}},{key: 'UP', popup: {macro: '` UP', display: 'P↑'}},{key: 'END', display: '↦', popup: {macro: '` .', display: 'W→'}},{key: 'PGUP', display: '⇞', popup: {macro: '` v', display: 'Copy'}}], [{key: 'CTRL', display: '⌃', popup: {macro: 'CTRL c', display: '^C'}},{key: 'ALT', display: '⌥', popup: {macro: '` z', display: 'Zoom'}},{key: 'TAB', display: '⇥', popup: {macro: '` c', display: 'New'}},{key: '/', popup: '|'},{key: 'LEFT', popup: {macro: '` LEFT', display: 'P←'}},{key: 'DOWN', popup: {macro: '` DOWN', display: 'P↓'}},{key: 'RIGHT', popup: {macro: '` RIGHT', display: 'P→'}},{key: 'PGDN', display: '⇟', popup: {macro: '` p', display: 'Paste'}}]]
extra-keys-style = arrows-all
terminal-onclick-url-open = true

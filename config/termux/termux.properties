# Two rows: device/connection controls at the left edge, modifiers on the lower row,
# and an inverted-T arrow cluster beside navigation keys on the right.
# Swipe-up follows keyboard symbol pairs; dollar swipes to percent.
extra-keys = [ \
  [ \
    {key: 'KEYBOARD', display: '⌨', popup: {macro: 'CTRL l', display: '^L'}}, \
    {key: 'ESC', display: 'esc', popup: {macro: 'CTRL d', display: '^D'}}, \
    {key: 'TAB', popup: 'ENTER'}, \
    {key: '`', popup: '~'}, \
    {key: '/', popup: '?'}, \
    {key: '-', popup: '_'}, \
    {key: '$', popup: '%'}, \
    {key: 'HOME', display: '↤', popup: {macro: '` ,', display: 'W←'}}, \
    {key: 'UP', popup: {macro: '` UP', display: 'P↑'}}, \
    {key: 'END', display: '↦', popup: {macro: '` .', display: 'W→'}}, \
    {key: 'PGUP', display: '⇞', popup: {macro: '` v', display: 'C▤'}} \
  ], \
  [ \
    {macro: 'ssh-connect SPACE --workbench ENTER', display: 'ssh', popup: {macro: 'termux-kinit-shortcut ENTER', display: 'kinit'}}, \
    {key: 'CTRL', display: 'ctrl', popup: {macro: 'CTRL c', display: '^C'}}, \
    {key: 'ALT', display: 'alt', popup: {macro: 'CTRL u', display: '^U'}}, \
    {key: 'SHIFT', display: '⇧', popup: {macro: '` z', display: 'P⛶'}}, \
    {key: '\\\\', display: '\\\\', popup: '|'}, \
    {key: '[', popup: '{'}, \
    {key: ']', popup: '}'}, \
    {key: 'LEFT', popup: {macro: '` LEFT', display: 'P←'}}, \
    {key: 'DOWN', popup: {macro: '` DOWN', display: 'P↓'}}, \
    {key: 'RIGHT', popup: {macro: '` RIGHT', display: 'P→'}}, \
    {key: 'PGDN', display: '⇟', popup: {macro: '` p', display: 'B↓'}} \
  ] \
]
extra-keys-style = arrows-all
extra-keys-text-all-caps = false
terminal-onclick-url-open = true
# Required for Termux:API notification actions to run the Workbench click
# handler. Android still gates callers with com.termux.permission.RUN_COMMAND.
allow-external-apps = true

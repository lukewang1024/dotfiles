name: Hyper
on:
  pull_request:
    paths:
      - config/hyper/**
      - config/hammerspoon/**
      - config/autohotkey/**
      - util/linux/hyper
      - tests/test_hyper_i18n.py
      - .github/workflows/hyper.yml
  push:
    branches: [main]
    paths:
      - config/hyper/**
      - config/hammerspoon/**
      - config/autohotkey/**
      - util/linux/hyper
      - tests/test_hyper_i18n.py
      - .github/workflows/hyper.yml
permissions:
  contents: read
jobs:
  i18n-and-adapters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: sudo apt-get update && sudo apt-get install -y luajit
      - run: python3 -B config/hyper/generate.py --check
      - run: python3 -B -m unittest discover -s config/hyper -p 'test_*.py'
      - run: |
          for test in config/hammerspoon/private/tests/*.lua; do
            luajit "$test" || exit 1
          done

name: Local agent skills
on:
  pull_request:
    paths:
      - config/agent/skills/codex-reset-card/**
      - config/agent/skills-keep.txt
      - util/agent/agent-skills-install
      - util/agent/agent-skills-prune
      - tests/test_agent_skills.py
      - .github/workflows/agent-skills.yml
  push:
    branches: [main]
    paths:
      - config/agent/skills/codex-reset-card/**
      - config/agent/skills-keep.txt
      - util/agent/agent-skills-install
      - util/agent/agent-skills-prune
      - tests/test_agent_skills.py
      - .github/workflows/agent-skills.yml
permissions:
  contents: read
jobs:
  local-skills:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python3 -B -m unittest discover -s tests -p test_agent_skills.py -v
